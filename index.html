<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C62828">
<meta name="robots" content="noindex,nofollow">
<title>조이코너 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FFF6E5;color:#3B2A1E;font-family:'Noto Sans KR',sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#FFF6E5;position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.scroll>*{flex-shrink:0}
.ttl{font-family:'Jua',sans-serif;font-size:28px;line-height:1.2}
.hello{font-family:'Jua',sans-serif;font-size:28px;line-height:1.2}
.sub{font-size:14px;color:#6B5646}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid #EBD9B8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.card{background:#fff;border:2px solid #EBD9B8;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;font-weight:700;color:#8A5A2B;display:flex;align-items:center;justify-content:space-between}
.big{font-family:'Jua',sans-serif;font-size:26px;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#6B5646}
.rowtop{display:flex;align-items:center;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:18px;background:#FFF1D6;font-size:14px;font-weight:500;border:0}
.chip.dashed{background:#fff;border:2px dashed #D9B98A;color:#8A5A2B;cursor:pointer}
.chip.sm{min-height:28px;padding:0 10px;font-size:12px}
.tag{font-size:11px;font-weight:700;color:#8E1B1B;background:#FBD5D2;border-radius:10px;padding:2px 8px;white-space:nowrap}
.tag.g{color:#1E6B3E;background:#DDF1E3}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:30px;background:#C62828;color:#fff;font-family:'Jua',sans-serif;font-size:24px;border:0;box-shadow:0 4px 0 #8E1B1B;cursor:pointer;width:100%}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #8E1B1B}
.pri{flex:1;min-height:52px;border-radius:26px;border:0;background:#C62828;color:#fff;font-family:'Jua',sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #8E1B1B;cursor:pointer}
.sec,.ghost{min-height:48px;padding:0 20px;border-radius:26px;border:2px solid #C62828;background:#fff;color:#C62828;font-size:15px;font-weight:700;cursor:pointer}
.danger{border-color:#B3261E;color:#B3261E}
.btns{display:flex;gap:10px}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:1;min-width:64px;min-height:44px;border-radius:22px;border:2px solid #EBD9B8;background:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 14px}
.seg button.on{background:#C62828;border-color:#C62828;color:#fff}
.carerow{display:flex;gap:8px;flex-wrap:wrap}
.carekid{flex:1 1 30%;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#FFF6E5;border-radius:18px;padding:10px 4px;border:0;cursor:pointer}
.carekid b{font-family:'Jua',sans-serif;font-size:17px;font-weight:400}
.bday{display:flex;align-items:center;gap:12px;font-size:16px}
.bday .d{font-family:'Jua',sans-serif;font-size:18px;background:#FFE08A;border-radius:14px;padding:6px 12px}
.nav{display:flex;background:#fff;border-top:2px solid #EBD9B8;padding:6px 8px calc(10px + env(safe-area-inset-bottom));gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:16px;font-size:12px;font-weight:500;color:#6B5646;background:none;border:0;cursor:pointer}
.tab.on{background:#FDE3E1;color:#C62828;font-weight:700}
/* attendance */
.ahead{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;background:#FFF6E5}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:700;color:#8E1B1B;background:#FBD5D2;border-radius:20px;padding:2px}
.date button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#8E1B1B;font-size:18px;cursor:pointer}
.date button:disabled{opacity:.25}
.date span{padding:0 6px;white-space:nowrap}
.story{font-size:14px;color:#6B5646}
.count{display:flex;align-items:center;gap:14px}
.num{font-family:'Jua',sans-serif;font-size:48px;line-height:1;color:#C62828}
.tot{font-family:'Jua',sans-serif;font-size:22px;color:#6B5646;margin-left:4px}
.bar{flex:1;height:14px;border-radius:7px;background:#EBD9B8;overflow:hidden}
.fill{height:100%;border-radius:7px;background:#2F7D4F;transition:width .2s}
.save{font-size:12px;font-weight:700;color:#1E6B3E}
.save.wait{color:#B26A00}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kid{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:136px;padding:10px 8px;border-radius:24px;border:2px solid #EBD9B8;background:#fff;cursor:pointer;user-select:none}
.kid .nm{font-family:'Jua',sans-serif;font-size:20px}
.kid .st{font-size:13px;font-weight:700;color:#6B5646}
.kid .stamp{display:none;position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#2F7D4F;color:#fff;align-items:center;justify-content:center}
.kid.on{background:#E6F5E9;border-color:#2F7D4F}
.kid.on .stamp{display:flex}
.kid.on .st{color:#1E6B3E}
.hint{font-size:13px;color:#6B5646;margin:0}
.addkid{min-height:56px;border-radius:24px;border:2px dashed #D9B98A;background:#fff;color:#8A5A2B;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
/* avatars */
.ph{border-radius:50%;object-fit:cover;background:#F3E4C8;display:block}
.avw{display:block;position:relative;flex:none;margin-top:4px}
.av{position:relative;width:64px;height:64px}
.av .ear{position:absolute;top:2px;width:22px;height:22px;border-radius:50%}
.av .ear.l{left:4px}.av .ear.r{right:4px}
.av .ear.bunny{width:16px;height:34px;border-radius:50% 50% 40% 40%;top:-8px}
.av .ear.bunny.l{left:14px}.av .ear.bunny.r{right:14px}
.av .ear.cat{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.av .ear.mouse{width:26px;height:26px;top:0}
.av .head{position:absolute;left:4px;right:4px;bottom:2px;height:52px;border-radius:50%}
.av .eye{position:absolute;top:21px;width:7px;height:7px;border-radius:50%;background:#3B2A1E}
.av .eye.l{left:15px}.av .eye.r{right:15px}
.av .cheek{position:absolute;top:30px;width:9px;height:6px;border-radius:50%;background:rgba(240,100,100,.4)}
.av .cheek.l{left:6px}.av .cheek.r{right:6px}
.av .mouth{position:absolute;top:29px;left:50%;margin-left:-4px;width:8px;height:5px;border-bottom:2px solid #3B2A1E;border-radius:0 0 8px 8px}
.av.c1 .head,.av.c1 .ear{background:#F6C28B}.av.c2 .head,.av.c2 .ear{background:#FFD66B}.av.c3 .head,.av.c3 .ear{background:#F4A9A0}
.av.c4 .head,.av.c4 .ear{background:#B9DDB0}.av.c5 .head,.av.c5 .ear{background:#A8D0F0}.av.c6 .head,.av.c6 .ear{background:#D9BFF2}
/* friends */
.search{width:100%;min-height:52px;border-radius:26px;border:2px solid #EBD9B8;background:#fff;padding:0 20px;font-size:16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 14px;border-radius:22px;border:2px solid #EBD9B8;background:#fff;cursor:pointer;text-align:left;width:100%}
.row .nm{font-family:'Jua',sans-serif;font-size:20px}
.row .grow{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.hide{display:none!important}
/* kid card */
.back{display:flex;align-items:center;gap:6px;min-height:44px;border:0;background:none;font-size:16px;font-weight:700;color:#8E1B1B;cursor:pointer;padding:0}
.photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:200px}
.slot{border-radius:22px;border:2px dashed #D9B98A;background:#fff;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#8A5A2B;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-align:center}
.slot.main{grid-row:1/3;border-style:solid;border-color:#EBD9B8}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .plus{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:#C62828;color:#fff;font-size:18px;line-height:30px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6B5646;width:38px}
.dot i{width:22px;height:22px;border-radius:50%;background:#EBD9B8;display:block}
.dot i.p{background:#2F7D4F}.dot i.a{background:#F4A9A0}
.person{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.person b{font-family:'Jua',sans-serif;font-weight:400;font-size:19px}
.person .cell{font-size:12px;color:#6B5646}
.contact{display:flex;gap:6px}
.contact a{min-width:48px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:#FDE3E1;color:#C62828;font-size:14px;font-weight:700;text-decoration:none;padding:0 12px}
.note{border-radius:16px;background:#FFF6E5;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.note small{color:#6B5646;display:flex;justify-content:space-between;align-items:center}
.note button{border:0;background:none;color:#B3261E;font-size:12px;cursor:pointer;min-height:32px}
textarea,.in{width:100%;border-radius:18px;border:2px solid #EBD9B8;background:#fff;padding:12px 14px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.in{min-height:48px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#8A5A2B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* stats */
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:132px;gap:2px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;flex:1}
.col b{font-size:12px}
.col i{display:block;width:70%;max-width:26px;border-radius:8px 8px 4px 4px;background:#E8A9A5}
.col i.cur{background:#C62828}
.axis{display:flex;justify-content:space-between;font-size:11px;color:#6B5646;gap:2px}
.axis span{flex:1;text-align:center}
.bigp{font-family:'Jua',sans-serif;font-size:40px;line-height:1;color:#C62828}
.bigp small{font-size:18px;color:#6B5646;margin-left:4px}
.hb{display:flex;align-items:center;gap:10px}
.hb .nm{width:52px;font-family:'Jua',sans-serif;font-size:17px}
.hb .tr{flex:1;height:16px;border-radius:8px;background:#F3E4C8;overflow:hidden}
.hb .tr i{display:block;height:100%;background:#C62828;border-radius:8px}
.hb .pc{width:44px;text-align:right;font-weight:700;font-size:14px}
.hb .nm.w{width:76px;font-size:16px}
.s2{font-size:13px;color:#6B5646}
.twoc{display:flex;gap:12px}.twoc .card{flex:1;padding:14px;gap:6px}
/* sheet & toast */
.sbg{position:absolute;inset:0;background:rgba(59,42,30,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:#FFF6E5;width:100%;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#3B2A1E;color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;z-index:20;text-align:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center}
.crop{touch-action:none;width:100%;max-width:300px;aspect-ratio:1;border-radius:24px;overflow:hidden;background:#222;align-self:center}
.crop canvas{width:100%;height:100%;display:block}
.pbar{height:12px;border-radius:6px;background:#EBD9B8;overflow:hidden}.pbar i{display:block;height:100%;background:#C62828;width:0}
input[type=range]{width:100%;accent-color:#C62828;min-height:40px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:#C62828}
/* v4 */
.cnt{font-size:28px;color:#C62828;margin-left:6px}.cnt small{font-size:16px;color:#6B5646;margin-left:2px}
.row2{display:flex;align-items:center;gap:10px}
.pri.sm{flex:none;min-height:46px;font-size:17px;padding:0 16px;border-radius:23px;box-shadow:0 3px 0 #8E1B1B}
.ahead{padding:12px 16px 10px!important;gap:8px!important;border-bottom:2px solid #EBD9B8}
.weekbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #EBD9B8;border-radius:24px;padding:4px}
.weekbar b{font-size:15px;color:#8E1B1B}
.weekbar button{width:44px;height:44px;border-radius:50%;border:0;background:#FDE3E1;color:#C62828;font-size:16px;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:6px 0;border-bottom:1px dashed #EBD9B8}
.kv:last-child{border-bottom:0}.kv span{color:#6B5646;flex:none}.kv b{text-align:right;font-weight:700}
.mine{background:#FFE08A;border-radius:8px;padding:0 6px}.chip.mine{background:#FFE08A}
.linkbtn{border:0;background:none;color:#C62828;font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.tapcard{text-align:left;cursor:pointer;font-family:inherit;color:inherit;width:100%}
.tapcard:disabled{cursor:default;opacity:1;color:inherit}
.post{white-space:pre-wrap;font-size:15px;line-height:1.7;background:#FFF6E5;border-radius:16px;padding:12px 14px;word-break:break-word}
.post a,.note a{color:#C62828}
.songrow{display:flex;gap:6px;align-items:stretch}.songrow .row{flex:1;min-width:0}
.num2{width:32px;height:32px;border-radius:50%;background:#C62828;color:#fff;font-family:'Jua',sans-serif;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.mv{display:flex;flex-direction:column;gap:4px}.mv button{flex:1;width:44px;border-radius:14px;border:2px solid #EBD9B8;background:#fff;color:#8A5A2B;cursor:pointer}
.mv button:disabled{opacity:.3}
.score{width:100%;border-radius:12px;background:#fff;border:1px solid #EBD9B8;min-height:120px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
